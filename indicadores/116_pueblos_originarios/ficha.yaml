# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 116
nombre: "Proporción de población perteneciente a pueblos originarios"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Porcentaje de la población regional que se autoidentifica como
  perteneciente a un pueblo indígena u originario reconocido por la Ley
  19.253.
unidad: "Porcentaje (%)"
tipo_dato: "Dato censal y de encuesta de hogares."
calculo: "(Personas que se autoidentifican con pueblo originario / Población total) x 100"
fuente: "INE — Censo de Población y Vivienda 2017; MIDESO — Encuesta CASEN"
fuente_id: censo   # clave en indicadores/fuentes.yaml
desagregaciones: "Pueblo de pertenencia, sexo, grupo etario"
disponibilidad: "Censal (2017); bienal (CASEN)"
comentario: >
  En Magallanes los pueblos originarios principales son el pueblo Kawésqar y
  el pueblo Yagán, además de población mapuche migrante. La
  autoidentificación puede variar entre instrumentos censales y encuestales.
  - fecha: 2026-10-18
    nota: "Renumerado de 111 a 116: el 111 pasa a la tasa de mortalidad en menores de 5 anos."
