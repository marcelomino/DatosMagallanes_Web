# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 115
nombre: "Índice de masculinidad"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Número de hombres por cada 100 mujeres en la población regional. Indica el
  equilibrio numérico entre sexos en la estructura demográfica.
unidad: "Hombres por cada 100 mujeres"
tipo_dato: "Cálculo derivado de censos y estimaciones de población."
calculo: "(Población masculina / Población femenina) x 100"
fuente: "INE — Censo de Población y Vivienda 2017; Estimaciones y proyecciones"
fuente_id: censo   # clave en indicadores/fuentes.yaml
desagregaciones: "Grupo etario, comuna"
disponibilidad: "Censal; estimaciones anuales"
comentario: >
  Magallanes ha presentado históricamente un índice de masculinidad superior
  a 100, asociado a actividades económicas extractivas. Los datos de
  prototipo muestran el índice por grupo etario, derivado de la distribución
  por sexo y edad.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-10-18
    nota: "Renumerado de 110 a 115: el 110 pasa a la tasa de mortalidad infantil."
