# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 113
nombre: "Población total por comuna"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Número de personas censadas o estimadas en cada comuna de la Región de
  Magallanes y de la Antártica Chilena en un año dado. Es el corte comunal
  del indicador 101.
unidad: "Número de personas"
tipo_dato: "Censos de Población y estimaciones intercensales."
calculo: "Conteo directo de población en operaciones censales; estimaciones intercensales basadas en componentes demográficos"
fuente: "INE — Censos de Población y Vivienda; Estimaciones y proyecciones de población"
fuente_id: censo   # clave en indicadores/fuentes.yaml
desagregaciones: "Zona urbana/rural"
disponibilidad: "Censos de Población; estimaciones comunales anuales"
comentario: >
  Hasta septiembre de 2026 este corte compartía el id 101 con la población
  total regional, de modo que dos cuadros distintos colgaban de una misma
  ficha. La concentración de la población regional en Punta Arenas hace que
  las comunas menores se lean como cero si el cuadro no declara su cifra.
  Campos heredados de la ficha 101: confirmar cobertura temporal del nivel
  comunal, que puede diferir de la regional.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
  - "PENDIENTE DE VALIDACION: la ficha 113 se redacto a partir de la ficha 101, de la que este corte era una desagregacion. Los campos heredados de 101 (`calculo`, `fuente`, `disponibilidad`) deben confirmarse para el nivel comunal, que puede tener una cobertura temporal distinta de la regional."
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/ (como 101_poblacion_comunas)"
  - fecha: 2026-09-16
    nota: "Renombrada a 113_poblacion_comunas. Compartia el id 101 con 101_poblacion_total, de modo que dos cuadros distintos colgaban de la misma ficha. Ahora es el indicador 113, con ficha propia."
