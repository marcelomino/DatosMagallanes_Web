# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 117
nombre: "Proporción de población migrante"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Proporción de personas nacidas en el extranjero respecto al total de la
  población residente habitual en la región.
unidad: "Porcentaje (%)"
tipo_dato: "Dato de encuesta y registros administrativos."
calculo: "(Inmigrantes / Población total) x 100"
fuente: "INE — Encuesta CASEN; Registros SERMIG"
fuente_id: censo   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, país de origen, comuna"
disponibilidad: "Bienal (años CASEN)"
comentario: >
  Incluye solo residentes habituales. Puede subestimar la población en
  situación migratoria irregular. La proporción de población migrante en
  Magallanes ha crecido sostenidamente desde 2017.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-10-18
    nota: "Renumerado de 112 a 117: el 112 pasa a la poblacion urbana y rural."
