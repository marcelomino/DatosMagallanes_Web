# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 502
nombre: "Nivel de confianza institucional"
seccion: Cohesion Social

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Porcentaje de personas que declara tener mucha o bastante confianza en una
  institución específica del país. Indicador de legitimidad y credibilidad
  de las instituciones ante la ciudadanía.
unidad: "Porcentaje (%)"
tipo_dato: "Dato de encuesta de opinión pública."
calculo: "% que declara 'mucha' o 'bastante' confianza en la institución"
fuente: "UER-UMAG — Encuesta Regional; PNUD — Encuesta de Desarrollo Humano"
fuente_id: uer_encuesta   # clave en indicadores/fuentes.yaml
desagregaciones: "Institución, sexo, grupo etario"
disponibilidad: "Según aplicación de encuesta"
comentario: >
  Indicador subjetivo de percepción ciudadana. Los niveles de confianza
  institucional en Chile son estructuralmente bajos en comparación con el
  promedio OCDE. Bomberos destaca consistentemente como la institución de
  mayor confianza.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-10-10
    nota: "fuente_id casen -> uer_encuesta: la fuente declarada es la Encuesta Regional UER-UMAG; casen era resto de la migracion de agosto"
