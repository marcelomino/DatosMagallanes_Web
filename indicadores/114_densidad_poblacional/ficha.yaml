# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 114
nombre: "Densidad poblacional"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Número de habitantes por kilómetro cuadrado de superficie regional. Un
  valor mayor indica una mayor concentración de población en el territorio
  y un valor menor, una población más dispersa.
unidad: "Habitantes por km²"
tipo_dato: "Valor publicado por el INE en sus informes de medio ambiente."
calculo: >
  Se utilizan directamente los valores de densidad publicados para
  Magallanes en cada edición del Informe Anual de Medio Ambiente / de
  Estadísticas del Medio Ambiente del INE. No se recalculó el indicador a
  partir de la población y la superficie ni se realizaron estimaciones o
  interpolaciones.
fuente: "INE — Informes Anuales de Medio Ambiente / Estadísticas del Medio Ambiente"
fuente_id: ine_medioambiente   # clave en indicadores/fuentes.yaml
desagregaciones: "No aplica a nivel regional"
disponibilidad: "Anual, 2017-2024"
comentario: >
  El INE no establece rangos oficiales para clasificar la densidad como
  baja, media o alta; su interpretación se hace por comparación temporal o
  territorial. Los valores pueden ser revisados entre ediciones debido a
  actualizaciones de las estimaciones de población. Para 2017 se conserva
  el valor de 1,3 hab/km² publicado originalmente, aunque ediciones
  posteriores lo actualizaron a 1,4 hab/km². La superficie incluye el
  territorio antártico reclamado por Chile, lo que afecta
  significativamente el cálculo.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "compilado desde INE, Informes Anuales de Medio Ambiente / Estadisticas del Medio Ambiente 2018-2025"
notas_calidad:
  - "Serie oficial 2017-2024, sin recalculo: se transcribe el valor de densidad publicado por el INE en cada edicion."
  - "2017 conserva el valor 1,3 publicado en la edicion original; ediciones posteriores lo revisaron a 1,4."
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-09-17
    nota: "Compilada la serie oficial 2017-2024 (INE, informes de medio ambiente) y enriquecida la ficha con la ficha tecnica de Drive."
  - fecha: 2026-10-18
    nota: "Renumerado de 108 a 114: el 108 pasa a la esperanza de vida al nacer."
