# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 401
nombre: "Esperanza de vida al nacer"
seccion: Bienestar

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Número promedio de años que se espera vivir al momento del nacimiento,
  bajo las condiciones de mortalidad actuales de la región.
unidad: "Años"
tipo_dato: "Estimación actuarial a partir de estadísticas vitales."
calculo: "Tabla de vida abreviada; promedio de años esperados para recién nacidos"
fuente: "INE — Estadísticas Vitales; DEIS-MINSAL"
fuente_id: ine_vitales   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo"
disponibilidad: "Quinquenal / estimaciones anuales"
comentario: >
  Desagregado por sexo: mujeres presentan mayor esperanza de vida. El
  aislamiento geográfico de la región es un factor contextual relevante para
  el acceso a servicios de salud. Los datos incluyen también la tasa de
  mortalidad infantil como indicador complementario.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
