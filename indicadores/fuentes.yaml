    url: "https://datosabiertos.mineduc.cl/"

  - id: mineduc_sies
    nombre: "Servicio de Informacion de Educacion Superior (SIES)"
    institucion: "Ministerio de Educacion (MINEDUC)"
    tipo: "Registro administrativo"
