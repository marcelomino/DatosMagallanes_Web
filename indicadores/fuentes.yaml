  - id: ine_enut
    nombre: "Encuesta Nacional sobre Uso del Tiempo (ENUT)"
    institucion: "INE"
    tipo: "Encuesta de hogares"
    periodicidad: "Irregular"
    url: "https://www.ine.gob.cl/enut"

  - id: obs_homicidios
