# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 301
nombre: "Tasa de pobreza por ingresos"
seccion: Pobreza e Ingresos

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Porcentaje de personas cuyos ingresos del hogar son inferiores a la línea
  de pobreza oficial establecida por MIDESO.
unidad: "Porcentaje (%)"
tipo_dato: "Dato de encuesta de hogares."
calculo: "(Personas bajo línea de pobreza / Total) x 100"
fuente: "MIDESO — Encuesta de Caracterización Socioeconómica (CASEN)"
fuente_id: casen   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, zona, grupo etario, comuna"
disponibilidad: "Bienal (años CASEN)"
comentario: >
  Metodología revisada en 2013; series anteriores a esa fecha no son
  estrictamente comparables. La línea de pobreza se actualiza con IPC.
  Magallanes presenta tasas de pobreza por ingresos consistentemente bajas
  respecto al promedio nacional.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
