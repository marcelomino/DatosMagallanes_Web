# ═════════════════════════════════════════════════════════════════════════
# ARCHIVO GENERADO — no editar a mano.
#
# Es la vista unica del catalogo, apilada desde las fichas individuales. La
# app NO lo lee: la fuente de verdad de cada indicador es su propia ficha en
# indicadores/{id}_{slug}/ficha.yaml, que es donde hay que editar.
#
# Regenerar:  Rscript _dev/agregar_fichas.R
# ═════════════════════════════════════════════════════════════════════════

indicadores:

  # ── POBLACION ─────────────────────────────────────────────────────────
  - id: 101
    nombre: "Población regional según sexo"
    seccion: Poblacion
    definicion: >
      Número de hombres y de mujeres censados o estimados a nivel regional en
      un año dado, desde el censo de 1907. Refleja el tamaño y la composición
      por sexo de la población residente habitual en la Región de Magallanes y
      de la Antártica Chilena.
    unidad: "Número de personas"
    tipo_dato: "Censos de Población y estimaciones intercensales."
    calculo: "Conteo directo de población por sexo en operaciones censales; estimaciones intercensales basadas en componentes demográficos"
    fuente: "INE — Censos de Población y Vivienda; Estimaciones y proyecciones de población"
    fuente_id: censo
    desagregaciones: "Sexo"
    disponibilidad: "Censos de Población (1907–2024)"
    comentario: >
      Incluye crecimiento vegetativo (nacimientos menos defunciones) y saldo
      migratorio (inmigración menos emigración). Los valores intercensales son
      estimaciones sujetas a revisión posterior. La serie larga permite
      observar la transición demográfica regional y el paso de una población
      muy masculinizada a una composición cercana al equilibrio.

  - id: 102
    nombre: "Población según comuna y sexo"
    seccion: Poblacion
    definicion: >
      Número de hombres y de mujeres censados en cada una de las once comunas
      de la Región de Magallanes y de la Antártica Chilena, en los censos de
      1992, 2002, 2017 y 2024. Permite comparar el tamaño y la composición por
      sexo de la población entre comunas y entre censos.
    unidad: "Número de personas"
    tipo_dato: "Censos de Población y Vivienda."
    calculo: "Conteo directo de población por comuna y sexo en operaciones censales"
    fuente: "INE — Censos de Población y Vivienda 1992, 2002, 2017 y 2024"
    fuente_id: censo
    desagregaciones: "Comuna, sexo"
    disponibilidad: "Censos de Población (1992, 2002, 2017, 2024)"
    comentario: >
      Punta Arenas concentra cerca de cuatro quintos de la población regional.
      Las comunas rurales y la comuna Antártica tienen una composición por
      sexo marcadamente masculina. El censo de 2002 tuvo cobertura distinta en
      algunas comunas rurales; las comparaciones entre censos deben leerse con
      cautela.

  - id: 103
    nombre: "Pirámide de población regional"
    seccion: Poblacion
    definicion: >
      Porcentaje de hombres y de mujeres de cada grupo quinquenal de edad,
      desde 0-4 años hasta 100 años y más, sobre la población total censada en
      la Región de Magallanes y de la Antártica Chilena, en los censos de
      1992, 2002, 2017 y 2024. Hombres y mujeres suman 100 en cada censo.
      Muestra la estructura por edad y sexo de la población y su cambio entre
      censos.
    unidad: "Porcentaje de la población total del censo"
    tipo_dato: "Censos de Población y Vivienda."
    calculo: "(Población del sexo y grupo de edad / población total del censo) x 100"
    fuente: "INE — Censos de Población y Vivienda 1992, 2002, 2017 y 2024"
    fuente_id: censo
    desagregaciones: "Sexo, grupo quinquenal de edad"
    disponibilidad: "Censos de Población (1992, 2002, 2017, 2024)"
    comentario: >
      Al expresarse en porcentaje, censos de tamaño distinto se comparan por
      la forma de su estructura y no por su volumen. El estrechamiento de la
      base y el ensanchamiento de las edades mayores describen el
      envejecimiento de la región, que el indicador 107 mide como tasa e
      índice.

  - id: 104
    nombre: "Tasa de dependencia demográfica"
    seccion: Poblacion
    definicion: >
      Corresponde a una medida demográfica para expresar la relación de la
      población, en términos de edad, entre las personas potencialmente
      activas y las personas potencialmente dependientes (inactivas).
      Normalmente se utilizan tres medidas: la relación de dependencia total,
      la infantil y la de adultos mayores.
    unidad: "Por cada 100 personas de 15 a 64 años"
    tipo_dato: "Cálculo derivado de estructura etaria censal o estimada."
    calculo: "Total: ((Población 0-14 + Población 65+) / Población 15-64) x 100. Infantil: (Población 0-14 / Población 15-64) x 100. Adultos mayores: (Población 65+ / Población 15-64) x 100.
"
    fuente: "INE — Censos de Población; Estimaciones y proyecciones"
    fuente_id: ine_proyecciones
    desagregaciones: "Dependencia total, infantil (0-14) y de adultos mayores (65+)"
    disponibilidad: "Censal; estimaciones anuales"
    comentario: >
      En Magallanes la dependencia de adultos mayores crece mientras la
      dependencia infantil disminuye, reflejando el proceso de envejecimiento;
      la dependencia total se mantiene relativamente estable porque ambos
      movimientos se compensan. El indicador es relevante para la
      planificación de servicios sociales y de salud.

  - id: 105
    nombre: "Tasa de envejecimiento demográfico"
    seccion: Poblacion
    definicion: >
      Relación entre la cantidad de personas mayores (generalmente de 60 o 65
      años en adelante) y la población más joven (menores de 15 años). Indica
      cuántas personas mayores hay por cada 100 menores de 15 años.
    unidad: "Personas mayores por cada 100 menores de 15 años"
    tipo_dato: "Estimación a partir de censos y proyecciones de población."
    calculo: "60 y más: (Población 60+ / Población 0-14) x 100. 65 y más: (Población 65+ / Población 0-14) x 100.
"
    fuente: "INE — Censos 2002 y 2017; Estimaciones y proyecciones de población"
    fuente_id: censo
    desagregaciones: "Umbral de persona mayor (60+ y 65+); sexo, zona, comuna"
    disponibilidad: "Censal (2002, 2017); estimaciones anuales"
    comentario: >
      Un valor de 100 indica que hay tantas personas mayores como menores de
      15 años; sobre 100, las personas mayores son más. La elección del umbral
      (60 o 65 años) cambia el nivel del indicador pero no su tendencia, por
      lo que se publican ambas series.

  - id: 106
    nombre: "Tasa global de fecundidad"
    seccion: Poblacion
    definicion: >
      Número promedio de hijos e hijas que tendría una mujer al finalizar su
      vida fértil, entre los 15 y 49 años, si estuviera expuesta a las tasas
      de fecundidad por edad observadas durante el año analizado. No
      corresponde al número real de hijos de cada mujer.
    unidad: "Hijos/as por mujer"
    tipo_dato: "Estimación a partir de estadísticas vitales (INE)."
    calculo: "Tasas regionales publicadas directamente por el INE en los anuarios, tabulados y boletines de Estadísticas Vitales de cada año. No se recalcularon tasas ni se realizaron estimaciones, interpolaciones o imputaciones.
"
    fuente: "INE — Estadísticas Vitales, anuarios y boletines anuales"
    fuente_id: ine_vitales
    desagregaciones: "No aplica a nivel regional"
    disponibilidad: "Anual, 2010-2025 (sin dato regional para 2017)"
    comentario: >
      El INE no establece categorías oficiales de fecundidad baja, media o
      alta para esta serie. Los valores de 2010-2023 son definitivos; los de
      2024 y 2025 son provisionales y pueden ser revisados. El año 2017 se
      mantiene sin dato porque no se encontró una tasa oficial para
      Magallanes: el anuario de ese año publica solo la TGF nacional. Para
      2018 se conserva el valor de 1,37 publicado en el gráfico regional, en
      lugar del valor redondeado de 1,4 incluido en el texto del anuario.

  - id: 107
    nombre: "Tasa bruta de natalidad"
    seccion: Poblacion
    definicion: >
      Número de nacidos vivos ocurridos durante un año por cada 1.000
      habitantes, considerando el lugar de residencia habitual de la madre o
      progenitor(a). Se denomina "bruta" porque utiliza la población total y
      no se ajusta por edad, sexo u otras características.
    unidad: "Nacidos vivos por 1.000 habitantes"
    tipo_dato: "Registro administrativo de estadísticas vitales (INE)."
    calculo: "Tasas regionales publicadas directamente por el INE, cuadro 1.2.2.1-01b. No se recalcularon tasas ni se realizaron estimaciones, interpolaciones o imputaciones.
"
    fuente: "INE — Estadísticas Vitales, cuadro 1.2.2.1-01b"
    fuente_id: ine_vitales
    desagregaciones: "Provincia (Magallanes, Antártica Chilena, Tierra del Fuego, Última Esperanza)"
    disponibilidad: "Anual, 2013-2023"
    comentario: >
      La tasa puede variar según el número de personas en edades
      reproductivas, por lo que no equivale directamente a la tasa global de
      fecundidad. El INE no establece categorías oficiales de natalidad baja,
      media o alta. Las tasas definitivas utilizan nacidos vivos corregidos y
      estimaciones de población; los nacimientos se asignan al lugar de
      residencia habitual de la madre o progenitor(a), no al lugar donde
      ocurrió el parto.

  - id: 108
    nombre: "Esperanza de vida al nacer, según sexo"
    seccion: Poblacion
    definicion: >
      Número promedio de años que se espera vivir al momento del nacimiento,
      bajo las condiciones de mortalidad actuales de la región.
    unidad: "Años"
    tipo_dato: "Estimación actuarial a partir de estadísticas vitales."
    calculo: "Tabla de vida abreviada; promedio de años esperados para recién nacidos"
    fuente: "INE — Estadísticas Vitales; DEIS-MINSAL"
    fuente_id: ine_vitales
    desagregaciones: "Sexo"
    disponibilidad: "Quinquenal / estimaciones anuales"
    comentario: >
      Desagregado por sexo: mujeres presentan mayor esperanza de vida. El
      aislamiento geográfico de la región es un factor contextual relevante
      para el acceso a servicios de salud. La tasa de mortalidad infantil
      (110) y la de menores de 5 años (111) complementan esta lectura.

  - id: 109
    nombre: "Tasa bruta de mortalidad"
    seccion: Poblacion
    definicion: >
      Número de defunciones ocurridas durante un año por cada 1.000
      habitantes, según el lugar de residencia habitual de la persona
      fallecida. Se denomina "bruta" porque relaciona todas las defunciones
      con la población total, sin ajustar por edad, sexo u otras
      características.
    unidad: "Defunciones por 1.000 habitantes"
    tipo_dato: "Registro administrativo de estadísticas vitales (INE)."
    calculo: "Tasas regionales publicadas directamente por el INE, cuadro 1.2.2.5-01b. No se recalcularon tasas ni se realizaron estimaciones o interpolaciones.
"
    fuente: "INE — Estadísticas Vitales, cuadro 1.2.2.5-01b"
    fuente_id: ine_vitales
    desagregaciones: "Provincia (Magallanes, Antártica Chilena, Tierra del Fuego, Última Esperanza)"
    disponibilidad: "Anual, 2013-2023"
    comentario: >
      La tasa está influida por la estructura etaria de la población; una
      región con mayor proporción de personas mayores puede presentar una tasa
      más alta sin que ello implique necesariamente mayor riesgo de muerte
      para cada grupo de edad. El INE no define categorías oficiales de
      mortalidad baja, media o alta. Desde 2016 no calcula tasas para
      territorios con menos de 20 defunciones, restricción que no afecta la
      serie regional publicada aquí.

  - id: 110
    nombre: "Tasa de mortalidad infantil, por sexo"
    seccion: Poblacion
    definicion: >
      Número de defunciones de menores de un año por cada mil nacidos vivos en
      un año dado.
    unidad: "Por mil nacidos vivos"
    tipo_dato: "Registro de estadísticas vitales."
    calculo: "(Defunciones de menores de 1 año / Nacidos vivos) x 1.000"
    fuente: "INE — Estadísticas Vitales; DEIS-MINSAL"
    fuente_id: ine_vitales
    desagregaciones: "Sexo"
    disponibilidad: "Anual"
    comentario: >
      La mortalidad infantil masculina es sistemáticamente mayor que la
      femenina. Con pocos nacimientos al año en la región, unas pocas
      defunciones mueven la tasa de manera visible: las variaciones entre años
      consecutivos deben leerse con cautela.

  - id: 111
    nombre: "Tasa de mortalidad en menores de 5 años, por sexo"
    seccion: Poblacion
    definicion: >
      Número de defunciones de niñas y niños menores de 5 años por cada mil
      nacidos vivos en un año dado.
    unidad: "Por mil nacidos vivos"
    tipo_dato: "Registro de estadísticas vitales."
    calculo: "(Defunciones de menores de 5 años / Nacidos vivos) x 1.000"
    fuente: "INE — Estadísticas Vitales; DEIS-MINSAL"
    fuente_id: ine_vitales
    desagregaciones: "Sexo"
    disponibilidad: "Anual"
    comentario: >
      Incluye la mortalidad infantil (menores de 1 año, indicador 110) más las
      defunciones de 1 a 4 años. Con pocos nacimientos al año en la región,
      las variaciones entre años consecutivos deben leerse con cautela.

  - id: 112
    nombre: "Población urbana y rural"
    seccion: Poblacion
    definicion: >
      Población residente en la región según área de residencia, urbana o
      rural, de acuerdo con la clasificación censal del INE. Se considera
      urbana la población que reside en entidades con más de 2.000 habitantes,
      o entre 1.001 y 2.000 habitantes cuando la mayoría de su población
      activa se dedica a actividades secundarias o terciarias; el resto es
      rural.
    unidad: "Número de personas y porcentaje del total regional"
    tipo_dato: "Censo de población."
    calculo: "Personas censadas por área de residencia, y su proporción sobre la población regional total, según publica el INE en cada censo.
"
    fuente: "INE — Censos de Población y Vivienda 1992, 2002, 2017 y 2024"
    fuente_id: censo
    desagregaciones: "Área urbana/rural; comuna"
    disponibilidad: "Censos 1992, 2002, 2017 y 2024"
    comentario: >
      Magallanes es una de las regiones más urbanizadas del país: cerca de
      nueve de cada diez habitantes residen en áreas urbanas, concentradas
      principalmente en Punta Arenas. Los criterios de clasificación
      urbano-rural del INE se han ajustado entre censos, por lo que las
      comparaciones deben considerar esos cambios.

  - id: 113
    nombre: "Tasa de crecimiento poblacional"
    seccion: Poblacion
    definicion: >
      Variación porcentual de la población total entre dos períodos censales o
      estimaciones consecutivas. Mide la velocidad de cambio demográfico de la
      región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Cálculo derivado de censos y estimaciones de población."
    calculo: "((Población año t - Población año t-1) / Población año t-1) x 100"
    fuente: "INE — Censos de Población y Vivienda; Estimaciones y proyecciones"
    fuente_id: censo
    desagregaciones: "No aplica"
    disponibilidad: "Intercensal; estimaciones anuales"
    comentario: >
      Magallanes presenta tasas de crecimiento bajas e incluso negativas en
      períodos recientes, consistentes con el proceso de envejecimiento y
      emigración de población joven. Datos derivados de la serie de población
      total.

  - id: 114
    nombre: "Densidad poblacional"
    seccion: Poblacion
    definicion: >
      Número de habitantes por kilómetro cuadrado de superficie regional. Un
      valor mayor indica una mayor concentración de población en el territorio
      y un valor menor, una población más dispersa.
    unidad: "Habitantes por km²"
    tipo_dato: "Valor publicado por el INE en sus informes de medio ambiente."
    calculo: "Se utilizan directamente los valores de densidad publicados para Magallanes en cada edición del Informe Anual de Medio Ambiente / de Estadísticas del Medio Ambiente del INE. No se recalculó el indicador a partir de la población y la superficie ni se realizaron estimaciones o interpolaciones.
"
    fuente: "INE — Informes Anuales de Medio Ambiente / Estadísticas del Medio Ambiente"
    fuente_id: ine_medioambiente
    desagregaciones: "No aplica a nivel regional"
    disponibilidad: "Anual, 2017-2024"
    comentario: >
      El INE no establece rangos oficiales para clasificar la densidad como
      baja, media o alta; su interpretación se hace por comparación temporal o
      territorial. Los valores pueden ser revisados entre ediciones debido a
      actualizaciones de las estimaciones de población. Para 2017 se conserva
      el valor de 1,3 hab/km² publicado originalmente, aunque ediciones
      posteriores lo actualizaron a 1,4 hab/km². La superficie incluye el
      territorio antártico reclamado por Chile, lo que afecta
      significativamente el cálculo.

  - id: 115
    nombre: "Índice de masculinidad"
    seccion: Poblacion
    definicion: >
      Número de hombres por cada 100 mujeres en la población regional. Indica
      el equilibrio numérico entre sexos en la estructura demográfica.
    unidad: "Hombres por cada 100 mujeres"
    tipo_dato: "Cálculo derivado de censos y estimaciones de población."
    calculo: "(Población masculina / Población femenina) x 100"
    fuente: "INE — Censo de Población y Vivienda 2017; Estimaciones y proyecciones"
    fuente_id: censo
    desagregaciones: "Grupo etario, comuna"
    disponibilidad: "Censal; estimaciones anuales"
    comentario: >
      Magallanes ha presentado históricamente un índice de masculinidad
      superior a 100, asociado a actividades económicas extractivas. Los datos
      de prototipo muestran el índice por grupo etario, derivado de la
      distribución por sexo y edad.

  - id: 116
    nombre: "Proporción de población perteneciente a pueblos originarios"
    seccion: Poblacion
    definicion: >
      Porcentaje de la población regional que se autoidentifica como
      perteneciente a un pueblo indígena u originario reconocido por la Ley
      19.253.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato censal y de encuesta de hogares."
    calculo: "(Personas que se autoidentifican con pueblo originario / Población total) x 100"
    fuente: "INE — Censo de Población y Vivienda 2017; MIDESO — Encuesta CASEN"
    fuente_id: censo
    desagregaciones: "Pueblo de pertenencia, sexo, grupo etario"
    disponibilidad: "Censal (2017); bienal (CASEN)"
    comentario: >
      En Magallanes los pueblos originarios principales son el pueblo Kawésqar
      y el pueblo Yagán, además de población mapuche migrante. La
      autoidentificación puede variar entre instrumentos censales y
      encuestales. - fecha: 2026-10-18 nota: "Renumerado de 111 a 116: el 111
      pasa a la tasa de mortalidad en menores de 5 anos."

  - id: 117
    nombre: "Proporción de población migrante"
    seccion: Poblacion
    definicion: >
      Proporción de personas nacidas en el extranjero respecto al total de la
      población residente habitual en la región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta y registros administrativos."
    calculo: "(Inmigrantes / Población total) x 100"
    fuente: "INE — Encuesta CASEN; Registros SERMIG"
    fuente_id: censo
    desagregaciones: "Sexo, país de origen, comuna"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      Incluye solo residentes habituales. Puede subestimar la población en
      situación migratoria irregular. La proporción de población migrante en
      Magallanes ha crecido sostenidamente desde 2017.


  # ── ECONOMIA ──────────────────────────────────────────────────────────
  - id: 201
    nombre: "Tasa de variación anual del PIB regional"
    seccion: Economia
    definicion: >
      Cambio porcentual del Producto Interno Bruto regional respecto al año
      anterior. Mide la velocidad de crecimiento o contracción de la actividad
      económica de la región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Estimación de cuentas nacionales regionales."
    calculo: "((PIB año t - PIB año t-1) / PIB año t-1) x 100"
    fuente: "Banco Central de Chile — Cuentas Nacionales Regionales"
    fuente_id: banco_central
    desagregaciones: "No aplica"
    disponibilidad: "Anual (rezago de 18-24 meses)"
    comentario: >
      Derivada de la serie de PIB regional. En el dashboard se presentan tanto
      el PIB en nivel como su variación anual. La pandemia de 2020 produjo una
      caída significativa seguida de una recuperación parcial.

  - id: 202
    nombre: "Participación sectorial en el PIB regional"
    seccion: Economia
    definicion: >
      Contribución porcentual de cada sector de actividad económica al
      Producto Interno Bruto regional. Permite identificar la estructura
      productiva y el grado de diversificación de la economía regional.
    unidad: "Porcentaje (%)"
    tipo_dato: "Estimación de cuentas nacionales regionales."
    calculo: "(PIB del sector / PIB regional total) x 100"
    fuente: "Banco Central de Chile — Cuentas Nacionales Regionales"
    fuente_id: banco_central
    desagregaciones: "Sector de actividad económica"
    disponibilidad: "Anual (rezago de 18-24 meses)"
    comentario: >
      Magallanes presenta una economía concentrada en sectores extractivos
      (hidrocarburos, pesca y acuicultura) y servicios (turismo, comercio). La
      diversificación productiva es un desafío estructural de la región.

  - id: 203
    nombre: "Número de empresas por área de actividad económica"
    seccion: Economia
    definicion: >
      Número de contribuyentes clasificados como empresas por el Servicio de
      Impuestos Internos, distribuidos según actividad económica, año
      comercial y comuna correspondiente al domicilio o casa matriz de la
      empresa.
    unidad: "Número de empresas"
    tipo_dato: "Registro administrativo tributario."
    calculo: "Conteo de contribuyentes clasificados como empresa. Se usan directamente los registros publicados por el SII, sin estimaciones, interpolaciones ni recalculos; el total regional que publica esta pieza es la suma de las empresas de las once comunas y de todas las actividades economicas para cada año comercial (ver \"comentario\").
"
    fuente: "SII — Estadísticas de Empresas (base PUB_COMU_ACT, seleccion regional)"
    fuente_id: sii
    desagregaciones: "Actividad económica (CIIU), comuna, tamaño de empresa"
    disponibilidad: "Anual, 2005-2024"
    comentario: >
      La ficha tecnica del SII trae la base completa desagregada por año
      comercial, comuna y actividad economica (19.022 filas para la region).
      El catalogo publica el TOTAL REGIONAL de empresas por año, que es la
      suma de "Número de empresas" de todas las comunas y actividades de ese
      año — cada empresa aporta una sola fila, la de su actividad principal,
      de modo que la suma no duplica contribuyentes. Se opto por esta
      agregacion en vez de desagregar por comuna (como hace
      113_poblacion_comunas) porque mantiene el cuadro II.4 simple y
      consistente con el resto de indicadores anuales del capitulo de
      Economia; el desagregado completo queda disponible en la base fuente si
      mas adelante se necesita un cuadro por comuna o por actividad. Existen
      cambios en la determinacion de la actividad economica a lo largo de la
      serie: para 2005-2014 se usa la actividad declarada en la Operacion
      Renta; entre 2015 y 2017 se replica la actividad informada para 2014; y
      desde 2018 se informa la actividad declarada por el contribuyente ante
      el SII. Este cambio metodologico no afecta el total regional publicado
      aqui (que no depende de la actividad), pero si a cualquier desagregacion
      futura por rubro. La base trae valores marcados con "*" en variables
      complementarias por reserva tributaria; no afectan a "Número de
      empresas".

  - id: 204
    nombre: "Número de trabajadores dependientes por área de actividad económica"
    seccion: Economia
    definicion: >
      Cantidad de trabajadores con contrato de trabajo dependiente en la
      región, clasificados por la actividad económica principal del empleador.
    unidad: "Número de trabajadores"
    tipo_dato: "Registro administrativo tributario y previsional."
    calculo: "Conteo de trabajadores dependientes informados por empleadores al SII"
    fuente: "SII — Estadísticas de empresas y trabajadores"
    fuente_id: sii
    desagregaciones: "Actividad económica (CIIU), sexo"
    disponibilidad: "Anual"
    comentario: >
      No incluye trabajadores independientes ni empleos informales.
      Complementa la información de la ENE con datos de registro
      administrativo.

  - id: 205
    nombre: "Tasa de desempleo"
    seccion: Economia
    definicion: >
      Proporción de personas en la fuerza de trabajo que no tienen empleo y
      buscan activamente uno durante el período de referencia.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Desocupados / Fuerza de trabajo) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, edad, zona"
    disponibilidad: "Trimestral (trimestres móviles)"
    comentario: >
      Presenta estacionalidad marcada por actividades de turismo y pesca. Se
      reporta el promedio anual para reducir la variabilidad estacional. Los
      datos incluyen también la tasa de ocupación como complemento.

  - id: 206
    nombre: "Número de ocupados por actividad económica"
    seccion: Economia
    definicion: >
      Cantidad de personas ocupadas en la región clasificadas según la
      actividad económica principal en que desempeñan su trabajo.
    unidad: "Número de personas"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "Estimación muestral de ocupados por sector (CIIU Rev. 4)"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Actividad económica, sexo"
    disponibilidad: "Trimestral"
    comentario: >
      Las estimaciones regionales de la ENE tienen mayor error muestral que
      las nacionales. Se recomienda usar promedios anuales para mayor
      estabilidad estadística.

  - id: 207
    nombre: "Estructura de ocupación por grupo ocupacional"
    seccion: Economia
    definicion: >
      Distribución porcentual de las personas ocupadas según su grupo
      ocupacional (clasificación CIUO-08). Permite caracterizar el tipo de
      empleo predominante en la región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Ocupados en grupo / Total ocupados) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Grupo ocupacional (CIUO-08), sexo"
    disponibilidad: "Trimestral"
    comentario: >
      Incluye grupos como profesionales, técnicos, trabajadores de servicios,
      operarios calificados, entre otros. Relevante para análisis de calidad
      del empleo regional.

  - id: 208
    nombre: "Tasa de informalidad laboral"
    seccion: Economia
    definicion: >
      Porcentaje de personas ocupadas clasificadas como informales por la
      Encuesta CASEN. Incluye, entre otros casos, a trabajadores dependientes
      sin cotizaciones previsionales y de salud asociadas a su empleo,
      personas que trabajan a honorarios, familiares no remunerados e
      independientes sin registro en el SII o que desempeñan ocupaciones de
      menor calificacion.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "Estimacion regional publicada directamente por MIDESO (encuesta CASEN 2024, archivo trabajo_casen_2024.xlsx, hoja 141: \"Porcentaje de ocupacion informal por region, 2006-2024\"). No se realizaron estimaciones, interpolaciones ni recalculos: se transcribe el nivel que publica la fuente para la Region de Magallanes y de la Antartica Chilena.
"
    fuente: "MIDESO — Encuesta de Caracterización Socioeconómica (CASEN)"
    fuente_id: casen
    desagregaciones: "Región (la ficha no trae desagregación por sexo, zona ni grupo etario para esta serie)"
    disponibilidad: "Según años de levantamiento CASEN: 2006, 2009, 2011, 2013, 2015, 2017, 2020, 2022 y 2024"
    comentario: >
      Serie bienal/irregular, no anual continua: sigue el calendario de
      levantamiento de la encuesta CASEN. Un porcentaje mayor indica que una
      proporcion mas alta de las personas ocupadas trabaja en condiciones
      clasificadas como informales; la fuente no establece rangos oficiales de
      informalidad baja, media o alta. Existe un quiebre metodologico entre
      2006-2017 y 2020-2024, especialmente en la clasificacion de trabajadores
      independientes, por lo que ambos periodos no son estrictamente
      comparables. El dato de 2020 ademas debe leerse considerando las
      condiciones especiales de la CASEN en Pandemia. Magallanes presenta
      tasas de informalidad consistentemente menores al promedio nacional en
      toda la serie.

  - id: 209
    nombre: "Ingreso laboral mediano"
    seccion: Economia
    definicion: >
      Valor central de la distribución de ingresos laborales de los ocupados
      en la región. El ingreso mediano divide la distribución en dos mitades
      iguales, siendo menos sensible a valores extremos que el promedio.
    unidad: "Pesos chilenos (CLP)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "Mediana de ingresos de la ocupación principal de los ocupados"
    fuente: "INE — Encuesta Suplementaria de Ingresos (ESI)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, nivel educacional, sector económico"
    disponibilidad: "Anual (ESI, cuarto trimestre)"
    comentario: >
      Se prefiere la mediana sobre el promedio por ser más representativa del
      ingreso típico. Los ingresos se expresan en pesos nominales del año de
      referencia.

  - id: 210
    nombre: "Tasa de cotización y previsión social"
    seccion: Economia
    definicion: >
      Proporción de trabajadores ocupados que cotizan en el sistema de
      pensiones y/o previsión social, indicador de formalización y protección
      social del empleo.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Ocupados que cotizan / Total ocupados) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, tipo de cotización (AFP, otro)"
    disponibilidad: "Trimestral"
    comentario: >
      Complementa la tasa de informalidad como indicador de calidad del
      empleo. No incluye cotizantes voluntarios sin empleo formal.

  - id: 211
    nombre: "Tasa de cobertura de salud entre ocupados"
    seccion: Economia
    definicion: >
      Proporción de trabajadores ocupados que cuentan con cobertura de seguro
      de salud (FONASA, Isapre u otro sistema).
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Ocupados con cobertura de salud / Total ocupados) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, tipo de seguro (FONASA, Isapre)"
    disponibilidad: "Trimestral"
    comentario: >
      La proporción de afiliados a FONASA vs Isapre es un indicador
      complementario de la estructura socioeconómica del empleo regional.

  - id: 212
    nombre: "Tasa de cobertura de seguro de desempleo entre ocupados"
    seccion: Economia
    definicion: >
      Proporción de trabajadores asalariados que cuentan con seguro de
      cesantía, mecanismo de protección ante la pérdida involuntaria del
      empleo.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Asalariados con seguro de cesantía / Total asalariados) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, tipo de contrato"
    disponibilidad: "Trimestral"
    comentario: >
      El seguro de cesantía es obligatorio para trabajadores con contrato a
      partir de octubre 2002 (Ley 19.728). Tasas bajas pueden indicar alta
      informalidad o contratos anteriores a la ley.

  - id: 213
    nombre: "Expectativas de oportunidades de trabajo futuras"
    seccion: Economia
    definicion: >
      Percepción de la población regional sobre las oportunidades laborales
      futuras en la región. Indicador subjetivo de confianza en el mercado
      laboral local.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% de personas que percibe oportunidades laborales positivas o en mejora"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Sexo, grupo etario, nivel educacional"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Indicador subjetivo basado en la percepción ciudadana. Complementa los
      indicadores objetivos de empleo con la dimensión de expectativas.

  - id: 214
    nombre: "PIB regional per cápita"
    seccion: Economia
    definicion: >
      Valor de la producción de bienes y servicios generada en la región
      dividida por la población total. Aproximación al nivel de actividad
      económica por habitante.
    unidad: "Miles de pesos corrientes (CLP)"
    tipo_dato: "Estimación de cuentas nacionales regionales."
    calculo: "PIB regional / Población total"
    fuente: "Banco Central de Chile — Cuentas Nacionales Regionales"
    fuente_id: banco_central
    desagregaciones: "Sin desagregación comunal disponible"
    disponibilidad: "Anual (rezago aproximado de 18 meses)"
    comentario: >
      Expresado en pesos corrientes. Para comparaciones temporales se
      recomienda deflactar por el IPC regional o nacional. Indicador adicional
      no incluido en el listado original de 63, pero relevante para el
      análisis económico regional y presente en el dashboard.

  - id: 215
    nombre: "Producto interno bruto regional"
    seccion: Economia
    definicion: >
      Valor total de los bienes y servicios finales producidos en la Región de
      Magallanes y de la Antártica Chilena en un año, a precios corrientes.
    unidad: "Millones de pesos chilenos"
    tipo_dato: "Cuentas nacionales regionalizadas."
    calculo: "Suma del valor agregado de las actividades económicas de la región, a precios corrientes"
    fuente: "Banco Central de Chile — Cuentas Nacionales, PIB regional"
    fuente_id: banco_central
    desagregaciones: "Actividad económica"
    disponibilidad: "Anual, con rezago"
    comentario: >
      Hasta septiembre de 2026 esta serie se publicaba en el cuadro II.1 sin
      ficha propia: viajaba como una columna del CSV de la variación anual del
      PIB (201), que es una medida distinta. El nivel y su variación son ahora
      dos piezas separadas. A precios corrientes, de modo que la serie mezcla
      variación real y variación de precios; la pieza 201 publica la variación
      que calcula el Banco Central.

  - id: 216
    nombre: "Tasa de ocupación"
    seccion: Economia
    definicion: >
      Proporción de personas ocupadas respecto de la población en edad de
      trabajar durante el período de referencia.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Ocupados / Población en edad de trabajar) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, edad, zona"
    disponibilidad: "Trimestral (trimestres móviles)"
    comentario: >
      Hasta septiembre de 2026 esta serie se publicaba en el cuadro II.2 sin
      ficha propia, junto a la tasa de desempleo (205). Son medidas
      complementarias pero distintas: la ocupación se calcula sobre la
      población en edad de trabajar y el desempleo sobre la fuerza de trabajo,
      de modo que no suman cien. Ficha redactada a partir de la 205; los
      campos cálculo, disponibilidad y desagregaciones deben confirmarse
      contra la fuente primaria.


  # ── POBREZA E INGRESOS ────────────────────────────────────────────────
  - id: 301
    nombre: "Tasa de pobreza por ingresos"
    seccion: Pobreza e Ingresos
    definicion: >
      Porcentaje de personas cuyos ingresos del hogar son inferiores a la
      línea de pobreza oficial establecida por MIDESO.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Personas bajo línea de pobreza / Total) x 100"
    fuente: "MIDESO — Encuesta de Caracterización Socioeconómica (CASEN)"
    fuente_id: casen
    desagregaciones: "Sexo, zona, grupo etario, comuna"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      Metodología revisada en 2013; series anteriores a esa fecha no son
      estrictamente comparables. La línea de pobreza se actualiza con IPC.
      Magallanes presenta tasas de pobreza por ingresos consistentemente bajas
      respecto al promedio nacional.

  - id: 302
    nombre: "Tasa de pobreza multidimensional"
    seccion: Pobreza e Ingresos
    definicion: >
      Porcentaje de personas que presentan carencias en al menos un umbral
      definido del índice de pobreza multidimensional, que considera
      dimensiones de educación, salud, trabajo y seguridad social, vivienda y
      entorno, y redes y cohesión social.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "% de personas con 22,5% o más de carencias ponderadas en las 5 dimensiones"
    fuente: "MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "Sexo, zona, grupo etario"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      La medición multidimensional de pobreza se implementa en Chile desde
      CASEN 2013. Complementa la medición por ingresos al capturar carencias
      no monetarias. Los datos se presentan junto a la pobreza por ingresos
      para facilitar la comparación.

  - id: 303
    nombre: "Índice de Gini de ingresos autónomos"
    seccion: Pobreza e Ingresos
    definicion: >
      Medida de desigualdad en la distribución del ingreso autónomo per cápita
      del hogar. Varía entre 0 (igualdad perfecta) y 1 (desigualdad máxima).
    unidad: "Índice (0 a 1)"
    tipo_dato: "Coeficiente calculado sobre datos de encuesta de hogares."
    calculo: "Coeficiente de Gini sobre ingreso autónomo per cápita del hogar"
    fuente: "MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "Zona urbana/rural"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      Chile presenta niveles medios-altos de desigualdad en contexto OCDE. Un
      valor de 0,43 indica desigualdad moderada-alta. El ingreso autónomo
      excluye transferencias del Estado, lo que permite medir la desigualdad
      de mercado.

  - id: 304
    nombre: "Razón de ingresos entre quintiles (índice 20/20)"
    seccion: Pobreza e Ingresos
    definicion: >
      Razón entre el ingreso promedio del quintil más rico (Q5) y el ingreso
      promedio del quintil más pobre (Q1). Medida intuitiva de la distancia
      entre extremos de la distribución del ingreso.
    unidad: "Veces"
    tipo_dato: "Cálculo derivado de datos de encuesta de hogares."
    calculo: "Ingreso promedio Q5 / Ingreso promedio Q1"
    fuente: "MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "No aplica"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      Complementa el coeficiente de Gini con una medida más fácil de
      interpretar. Los datos de quintiles se presentan también como
      distribución de ingresos en el dashboard.

  - id: 305
    nombre: "Ingreso autónomo per cápita del hogar"
    seccion: Pobreza e Ingresos
    definicion: >
      Promedio del ingreso autónomo del hogar dividido por el número de
      integrantes. El ingreso autónomo incluye ingresos del trabajo, rentas de
      la propiedad y jubilaciones, excluyendo transferencias monetarias del
      Estado.
    unidad: "Pesos chilenos (CLP)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "Suma de ingresos autónomos del hogar / Número de integrantes"
    fuente: "MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "Quintil, zona, sexo del jefe de hogar"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      Se expresa en pesos nominales del año de la encuesta. Para comparaciones
      temporales, deflactar por IPC.

  - id: 306
    nombre: "Brecha salarial entre sexos"
    seccion: Pobreza e Ingresos
    definicion: >
      Diferencia porcentual entre el ingreso laboral promedio de hombres y
      mujeres, expresada como proporción del ingreso masculino. Indicador de
      inequidad de género en el mercado laboral.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "((Ingreso hombres - Ingreso mujeres) / Ingreso hombres) x 100"
    fuente: "MIDESO — Encuesta CASEN; INE — ESI"
    fuente_id: casen
    desagregaciones: "Nivel educacional, sector económico"
    disponibilidad: "Bienal (CASEN); anual (ESI)"
    comentario: >
      Los datos de prototipo muestran ingresos promedio por sexo. La brecha
      salarial puede explicarse parcialmente por diferencias en horas
      trabajadas, sector y nivel educacional, pero persiste una brecha no
      explicada por estas variables.

  - id: 307
    nombre: "Tasa de hacinamiento habitacional"
    seccion: Pobreza e Ingresos
    definicion: >
      Porcentaje de hogares que presentan condición de hacinamiento. Sin
      hacinamiento son los hogares con menos de 2,5 personas por dormitorio de
      uso exclusivo; con hacinamiento medio, entre 2,5 y 3,49; con
      hacinamiento alto, entre 3,5 y 4,99; y con hacinamiento crítico, 5 o más
      personas por dormitorio, o cuando el hogar no dispone de un dormitorio
      de uso exclusivo. La tasa publicada reúne las categorías medio, alto y
      crítico.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "Se usan directamente las estimaciones regionales de \"Hogares en condición de hacinamiento\" que publica el Ministerio de Desarrollo Social y Familia para la Región de Magallanes y de la Antártica Chilena; esa cifra ya reúne las categorías medio, alto y crítico, sin que Datos Magallanes recalcule ni interpole nada.
"
    fuente: "MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "Zona, quintil de ingreso (no incluidas en esta serie regional)"
    disponibilidad: "2013, 2015, 2017, 2020 y 2022 (bienal, según levantamientos CASEN)"
    comentario: >
      El hacinamiento es una dimensión de la pobreza multidimensional y afecta
      la calidad de vida y salud de los hogares. El año 2020 corresponde a
      Casen en Pandemia, con cambios metodológicos en el levantamiento: sus
      comparaciones con otros períodos deben leerse con cautela. Desde 2024 la
      metodología de medición de pobreza multidimensional cambió y el
      hacinamiento dejó de publicarse como indicador separado bajo esta misma
      estructura, pasando a integrar los indicadores de déficit habitacional
      (ver 308_deficit_habitacional); por eso esta serie no incorpora un valor
      2024, para no mezclar mediciones no equivalentes.

  - id: 308
    nombre: "Proporción de hogares con déficit habitacional cuantitativo"
    seccion: Pobreza e Ingresos
    definicion: >
      Porcentaje de hogares que requieren una vivienda nueva por alguna de
      cuatro condiciones: viviendas irrecuperables (no mejorables por su tipo
      o materialidad), hogares allegados (comparten vivienda con otro hogar,
      presupuesto independiente), núcleos allegados hacinados (comparten
      vivienda y presentan 2,5 o más personas por dormitorio) y viviendas con
      hacinamiento no ampliable (el problema de espacio no se resuelve
      mediante una ampliación).
    unidad: "Porcentaje (%)"
    tipo_dato: "Estimación con base en encuesta de hogares (CASEN)."
    calculo: "Total de hogares en déficit cuantitativo (suma de los cuatro componentes) dividido por el total de hogares de la región, x 100. El Centro de Estudios de Ciudad y Territorio del MINVU publica el número de hogares en déficit y el total de hogares por región; Datos Magallanes usa ambas cifras oficiales, sin recalcular ni interpolar los componentes, para obtener el porcentaje regional.
"
    fuente: "MINVU — Centro de Estudios de Ciudad y Territorio, con base en Encuesta CASEN (MIDESO)"
    fuente_id: minvu_ceut
    desagregaciones: "Componente de déficit, quintil de ingreso, zona (no incluidas en esta serie regional total)"
    disponibilidad: "1996, 1998, 2000, 2003, 2006, 2009, 2011, 2013, 2015, 2017, 2020, 2022 y 2024 (según levantamientos CASEN)"
    comentario: >
      Un porcentaje mayor representa una mayor proporción de hogares que
      requieren una vivienda nueva. La fuente no establece categorías
      oficiales de déficit bajo, medio o alto. La metodología vigente
      incorpora las viviendas con hacinamiento no ampliable como cuarto
      componente desde la base "Déficit Habitacional Cuantitativo por Región,
      Quintil y Zona, CASEN 1996–2024". El dato de 2020 corresponde a Casen en
      Pandemia y debe interpretarse con cautela por los cambios metodológicos
      del levantamiento. El déficit cuantitativo se distingue del déficit
      cualitativo (viviendas con deficiencias de materialidad o saneamiento
      pero que no requieren reemplazo); ambos son relevantes para la política
      habitacional regional, pero esta ficha publica solo el cuantitativo, que
      es el que trae la base de MINVU/CEUT disponible.

  - id: 309
    nombre: "Distribución socioeconómica de los hogares (quintiles de ingreso)"
    seccion: Pobreza e Ingresos
    definicion: >
      Distribución porcentual de los hogares de la región según quintiles de
      ingreso autónomo per cápita nacional. Permite evaluar la posición
      relativa de los hogares regionales en la distribución nacional del
      ingreso.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "% de hogares regionales en cada quintil nacional de ingreso"
    fuente: "MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "Zona urbana/rural"
    disponibilidad: "Bienal (años CASEN)"
    comentario: >
      Los quintiles se definen a nivel nacional. Una región donde los hogares
      se concentran en quintiles superiores indica ingresos relativamente más
      altos que el promedio del país.

  - id: 310
    nombre: "Ingreso mediano por pensiones"
    seccion: Pobreza e Ingresos
    definicion: >
      Valor mediano de las pensiones recibidas por los jubilados de la región,
      incluyendo pensiones contributivas (AFP), pensión básica solidaria y
      aportes previsionales solidarios.
    unidad: "Pesos chilenos (CLP)"
    tipo_dato: "Dato de encuesta de hogares y registros administrativos."
    calculo: "Mediana de pensiones totales de los jubilados de la región"
    fuente: "MIDESO — Encuesta CASEN; Superintendencia de Pensiones"
    fuente_id: casen
    desagregaciones: "Sexo, tipo de pensión"
    disponibilidad: "Bienal (CASEN); mensual (Sup. Pensiones)"
    comentario: >
      Relevante en el contexto de envejecimiento demográfico de la región. Las
      pensiones de Magallanes incluyen bonificaciones por zona extrema.


  # ── BIENESTAR ─────────────────────────────────────────────────────────
  - id: 402
    nombre: "Tasa neta de matrícula por nivel educativo"
    seccion: Bienestar
    definicion: >
      Proporción de personas en edad oficial de cursar un nivel educativo que
      efectivamente se encuentran matriculadas en ese nivel.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato administrativo de registros de matrícula."
    calculo: "(Matriculados en edad oficial / Total en edad oficial) x 100"
    fuente: "MINEDUC — Sistema de Información General de Estudiantes (SIGE)"
    fuente_id: mineduc_sige
    desagregaciones: "Sexo, dependencia administrativa, zona, nivel educativo"
    disponibilidad: "Anual"
    comentario: >
      Diferente a la tasa bruta de matrícula. Refleja el acceso oportuno al
      sistema educativo en la edad correspondiente al nivel. Se presenta para
      educación básica, media y superior.

  - id: 403
    nombre: "Tasa neta de asistencia escolar"
    seccion: Bienestar
    definicion: >
      Porcentaje de personas que se encuentran en la edad teórica de cursar un
      nivel educativo y que asisten efectivamente a ese mismo nivel. La
      educación básica considera a la población de 6 a 13 años que asiste a
      enseñanza básica; la educación media considera a la población de 14 a 17
      años que asiste a enseñanza media. Se llama "neta" porque relaciona la
      asistencia con la edad oficialmente correspondiente a cada nivel.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares (Encuesta Casen)."
    calculo: "(Población en edad teórica que asiste al nivel correspondiente / Población en esa edad teórica) x 100"
    fuente: "Ministerio de Desarrollo Social y Familia — Encuesta Casen 2024"
    fuente_id: casen
    desagregaciones: "Nivel (básica, media); la fuente publica además error estándar y casos muestrales por nivel"
    disponibilidad: "2006, 2009, 2011, 2013, 2015, 2017, 2020, 2022 y 2024 (según levantamiento Casen)"
    comentario: >
      No incluye en el numerador a quienes asisten a un nivel distinto del
      correspondiente a su edad: por eso difiere de una tasa de matrícula. La
      fuente no establece categorías oficiales de asistencia baja, media o
      alta. El dato de 2020 corresponde a la Casen en Pandemia, con cambios
      metodológicos que exigen cautela al compararlo con el resto de la serie.

  - id: 404
    nombre: "Promedio de años de escolaridad de la población adulta"
    seccion: Bienestar
    definicion: >
      Promedio de años de educación formal aprobados por las personas de 18
      años o más. Un valor mayor indica que la población adulta ha completado,
      en promedio, una mayor cantidad de años de estudio; no mide la calidad
      de la educación ni equivale necesariamente al nivel educativo alcanzado
      por cada persona.
    unidad: "Años de escolaridad"
    tipo_dato: "Dato de encuesta de hogares (Encuesta Casen)."
    calculo: "Promedio de años de escolaridad aprobados en la población de 18 años o más"
    fuente: "Ministerio de Desarrollo Social y Familia — Encuesta Casen 2024"
    fuente_id: casen
    desagregaciones: "Sin desagregación en esta serie; la fuente publica además error estándar y casos muestrales por año"
    disponibilidad: "2006, 2009, 2011, 2013, 2015, 2017, 2020, 2022 y 2024 (según levantamiento Casen)"
    comentario: >
      La fuente no establece categorías oficiales de escolaridad baja, media o
      alta. El encabezado de la hoja de origen usa por error la expresión
      "Porcentaje"; el título, los valores y la naturaleza del indicador
      corresponden a años de escolaridad, que es la unidad que se publica
      aquí. El dato de 2020 corresponde a la Casen en Pandemia, con cambios
      metodológicos que exigen cautela al compararlo con el resto de la serie.

  - id: 405
    nombre: "Matrícula total en educación superior"
    seccion: Bienestar
    definicion: >
      Número de registros de matrícula informados por las instituciones de
      educación superior de la región para programas de pregrado, posgrado y
      postítulo. Es un conteo de matrículas, no de personas: una misma persona
      puede registrar más de una matrícula, de modo que el indicador no
      representa estudiantes únicos.
    unidad: "Registros de matrícula"
    tipo_dato: "Registro administrativo (SIES)."
    calculo: "Conteo de registros de matrícula en programas de pregrado, posgrado y postítulo, fila 'XII Región'"
    fuente: "Ministerio de Educación, Subsecretaría de Educación Superior — SIES, Compendio Histórico de Educación Superior"
    fuente_id: mineduc_sies
    desagregaciones: "Sin desagregación en esta serie regional; el compendio SIES permite desagregar por institución, área del conocimiento y sexo"
    disponibilidad: "Anual, 1984-2026"
    comentario: >
      La región se asocia al programa o sede que informa la institución: en
      modalidad a distancia esa imputación administrativa puede no coincidir
      con la ubicación de la persona estudiante. La serie tiene dos tramos de
      origen distinto: 1984-2006 proviene de bases agregadas de la antigua
      División de Educación Superior (DIVESUP), previa a la creación de SIES;
      desde 2007 la información es recopilada directamente por SIES desde las
      instituciones. Conviene distinguir ambos tramos en análisis de largo
      plazo. La Universidad de Magallanes es la principal institución de
      educación superior de la región.

  - id: 406
    nombre: "Titulación total en educación superior"
    seccion: Bienestar
    definicion: >
      Número total de titulaciones — títulos, grados y certificaciones —
      otorgadas durante el año por programas de educación superior de la
      región: pregrado (carreras técnicas y profesionales), posgrado (magíster
      y doctorado) y postítulo (diplomas, postítulos y especialidades médicas
      u odontológicas).
    unidad: "Titulaciones otorgadas"
    tipo_dato: "Registro administrativo (SIES)."
    calculo: "Conteo de titulaciones otorgadas en el año, fila 'XII Región'"
    fuente: "Ministerio de Educación, Subsecretaría de Educación Superior — SIES, Compendio Histórico de Titulación e Informe de Titulación"
    fuente_id: mineduc_sies
    desagregaciones: "Sin desagregación en esta serie regional; el compendio SIES permite desagregar por institución, nivel y área del conocimiento"
    disponibilidad: "Anual, 1999-2025"
    comentario: >
      El indicador contabiliza titulaciones otorgadas, no personas tituladas
      únicas: una misma persona puede obtener más de una. La región
      corresponde a la que informa la institución, sede o programa, y no
      necesariamente a la ubicación física de la persona titulada (relevante
      en programas a distancia). La serie tiene dos tramos de origen distinto:
      1999-2006 proviene de bases agregadas de la antigua División de
      Educación Superior (DIVESUP), previa a la creación de SIES; desde 2007
      la información es recopilada directamente por SIES desde las
      instituciones. El año académico 2025 comprende titulaciones entre el 1
      de marzo de 2025 y el 28 de febrero de 2026, y SIES puede rectificar
      años anteriores al cerrar cada proceso anual. En 2025 se registraron
      1.284 titulaciones, un 3,3% menos que en 2024, según el informe oficial
      de SIES.

  - id: 407
    nombre: "Nivel educacional de la población ocupada"
    seccion: Bienestar
    definicion: >
      Distribución porcentual de los trabajadores ocupados según el máximo
      nivel educacional alcanzado (básica, media, técnica superior,
      universitaria).
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Ocupados en nivel educacional / Total ocupados) x 100"
    fuente: "INE — Encuesta Nacional de Empleo (ENE)"
    fuente_id: ine_ene
    desagregaciones: "Sexo, sector económico"
    disponibilidad: "Trimestral"
    comentario: >
      Indicador que vincula educación y mercado laboral. Permite evaluar si la
      estructura productiva regional aprovecha el capital humano disponible.

  - id: 408
    nombre: "Prevalencia de discapacidad"
    seccion: Bienestar
    definicion: >
      Proporción de la población que presenta algún grado de discapacidad
      según los criterios de la Clasificación Internacional del Funcionamiento
      (CIF) de la OMS.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Personas con discapacidad / Población total) x 100"
    fuente: "MIDESO — Encuesta CASEN; SENADIS — Estudio Nacional de Discapacidad (ENDISC)"
    fuente_id: casen
    desagregaciones: "Grado de discapacidad, sexo, grupo etario"
    disponibilidad: "Bienal (CASEN); según ENDISC"
    comentario: >
      La prevalencia aumenta con la edad, lo que es relevante en el contexto
      de envejecimiento de Magallanes. El ENDISC ofrece mayor detalle pero
      tiene menor frecuencia.

  - id: 409
    nombre: "Parentesco del cuidador principal de personas en situación de dependencia"
    seccion: Bienestar
    definicion: >
      Distribución de los cuidadores principales de personas dependientes
      según su relación de parentesco con la persona cuidada (cónyuge, hijo/a,
      otro familiar, no familiar).
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Cuidadores según parentesco / Total cuidadores) x 100"
    fuente: "MIDESO — Encuesta CASEN (módulo de dependencia)"
    fuente_id: casen
    desagregaciones: "Tipo de parentesco"
    disponibilidad: "Bienal (años CASEN con módulo de dependencia)"
    comentario: >
      El cuidado recae mayoritariamente en familiares directos, especialmente
      mujeres. Este indicador es parte del bloque de cuidados del dashboard.

  - id: 410
    nombre: "Sexo del cuidador principal de personas en situación de dependencia"
    seccion: Bienestar
    definicion: >
      Distribución por sexo de las personas que ejercen como cuidador
      principal de personas en situación de dependencia funcional.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Cuidadores por sexo / Total cuidadores) x 100"
    fuente: "MIDESO — Encuesta CASEN (módulo de dependencia)"
    fuente_id: casen
    desagregaciones: "Sexo"
    disponibilidad: "Bienal (años CASEN con módulo de dependencia)"
    comentario: >
      Evidencia la feminización del cuidado: la gran mayoría de cuidadores
      principales son mujeres, lo que tiene implicancias en su participación
      laboral e ingresos.

  - id: 411
    nombre: "Tasa de dependencia funcional"
    seccion: Bienestar
    definicion: >
      Proporción de la población que presenta dependencia funcional
      (dificultad para realizar actividades de la vida diaria sin asistencia),
      sobre el total de la población.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Personas con dependencia funcional / Población total) x 100"
    fuente: "MIDESO — Encuesta CASEN (módulo de dependencia)"
    fuente_id: casen
    desagregaciones: "Grado de dependencia, sexo, grupo etario"
    disponibilidad: "Bienal (años CASEN con módulo de dependencia)"
    comentario: >
      La dependencia funcional aumenta con la edad. Dada la estructura etaria
      de Magallanes, esta tasa es particularmente relevante para la
      planificación de servicios de cuidado.

  - id: 412
    nombre: "Número de cuidadores formales e informales"
    seccion: Bienestar
    definicion: >
      Estimación del número de personas que ejercen labores de cuidado de
      personas dependientes, distinguiendo entre cuidadores formales
      (remunerados, capacitados) e informales (familiares, voluntarios).
    unidad: "Número de personas"
    tipo_dato: "Dato de encuesta de hogares y registros administrativos."
    calculo: "Estimación de cuidadores formales (registros) + informales (encuesta)"
    fuente: "MIDESO — Encuesta CASEN; SENAMA — Registros de cuidadores"
    fuente_id: casen
    desagregaciones: "Tipo (formal/informal), sexo"
    disponibilidad: "Bienal (CASEN); según registros"
    comentario: >
      La distinción formal/informal es relevante para la política pública de
      cuidados. Chile avanza hacia un sistema nacional de cuidados que
      requiere esta información base.

  - id: 413
    nombre: "Distribución del uso del tiempo"
    seccion: Bienestar
    definicion: >
      Distribución de las horas del día entre trabajo remunerado, trabajo
      doméstico y de cuidados no remunerado, tiempo libre y otras actividades,
      con desagregación por sexo.
    unidad: "Horas/día"
    tipo_dato: "Dato de encuesta especializada."
    calculo: "Promedio de horas diarias dedicadas a cada tipo de actividad"
    fuente: "INE — Encuesta Nacional de Uso del Tiempo (ENUT)"
    fuente_id: ine_enut
    desagregaciones: "Sexo, tipo de actividad"
    disponibilidad: "Según aplicación de la ENUT (2015)"
    comentario: >
      La ENUT 2015 es la única encuesta nacional de uso del tiempo en Chile.
      Evidencia brechas de género significativas en trabajo no remunerado. No
      hay datos regionales desagregados públicamente.

  - id: 414
    nombre: "Índice de habitabilidad de la vivienda"
    seccion: Bienestar
    definicion: >
      Distribución de la tenencia de vivienda en la región según categorías de
      propiedad (propia pagada, propia pagando, arrendada, cedida, otras).
      Indicador de acceso y seguridad habitacional.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato censal y de encuesta de hogares."
    calculo: "(Hogares en categoría de tenencia / Total hogares) x 100"
    fuente: "INE — Censo de Población y Vivienda; MIDESO — Encuesta CASEN"
    fuente_id: casen
    desagregaciones: "Tipo de tenencia, zona"
    disponibilidad: "Censal; bienal (CASEN)"
    comentario: >
      Los datos de prototipo muestran la distribución por tipo de tenencia. La
      proporción de vivienda propia (pagada + pagando) indica el grado de
      acceso a la propiedad habitacional en la región.


  # ── COHESION SOCIAL ───────────────────────────────────────────────────
  - id: 501
    nombre: "Nivel de confianza interpersonal"
    seccion: Cohesion Social
    definicion: >
      Proporción de personas que declara que se puede confiar en la mayoría de
      las personas. Indicador del capital social y la disposición a la
      cooperación en la sociedad regional.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% que responde positivamente a la pregunta de confianza interpersonal"
    fuente: "UER-UMAG — Encuesta Regional; PNUD — Encuesta de Desarrollo Humano"
    fuente_id: casen
    desagregaciones: "Sexo, grupo etario, nivel educacional"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Chile presenta niveles de confianza interpersonal estructuralmente bajos
      en comparación con países OCDE. La pregunta estándar es: "¿Diría usted
      que se puede confiar en la mayoría de las personas?"

  - id: 502
    nombre: "Nivel de confianza institucional"
    seccion: Cohesion Social
    definicion: >
      Porcentaje de personas que declara tener mucha o bastante confianza en
      una institución específica del país. Indicador de legitimidad y
      credibilidad de las instituciones ante la ciudadanía.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión pública."
    calculo: "% que declara 'mucha' o 'bastante' confianza en la institución"
    fuente: "UER-UMAG — Encuesta Regional; PNUD — Encuesta de Desarrollo Humano"
    fuente_id: uer_encuesta
    desagregaciones: "Institución, sexo, grupo etario"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Indicador subjetivo de percepción ciudadana. Los niveles de confianza
      institucional en Chile son estructuralmente bajos en comparación con el
      promedio OCDE. Bomberos destaca consistentemente como la institución de
      mayor confianza.

  - id: 503
    nombre: "Actitud hacia la democracia"
    seccion: Cohesion Social
    definicion: >
      Proporción de personas que considera que la democracia es preferible a
      cualquier otra forma de gobierno. Indicador de apoyo al régimen
      democrático en la población regional.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% que prefiere la democracia sobre otras formas de gobierno"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Sexo, grupo etario, nivel educacional"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Pregunta comparable con Latinobarómetro. Permite evaluar la legitimidad
      democrática a nivel regional y comparar con tendencias nacionales y
      latinoamericanas.

  - id: 504
    nombre: "Tasa de victimización y percepción de inseguridad"
    seccion: Cohesion Social
    definicion: >
      Proporción de personas que declaran haber sido víctimas de algún delito
      en los últimos 12 meses y/o que perciben inseguridad en su entorno
      cotidiano.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión y seguridad."
    calculo: "% de personas que declara haber sido víctima de delito; % que se siente inseguro"
    fuente: "UER-UMAG — Encuesta Regional; Subsecretaría de Prevención del Delito — ENUSC"
    fuente_id: cead
    desagregaciones: "Sexo, tipo de delito, zona"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      La victimización objetiva y la percepción de inseguridad no siempre
      coinciden. Magallanes presenta históricamente niveles de victimización
      inferiores al promedio nacional.

  - id: 505
    nombre: "Percepción de progreso regional"
    seccion: Cohesion Social
    definicion: >
      Proporción de personas que considera que la región ha progresado o está
      progresando en aspectos sociales, económicos y de calidad de vida.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% de personas que percibe progreso en la región"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Sexo, grupo etario, ámbito de progreso"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Indicador subjetivo que complementa los indicadores objetivos de
      desarrollo. Permite evaluar si las mejoras medibles se traducen en
      percepción positiva de la población.

  - id: 506
    nombre: "Identificación con el territorio"
    seccion: Cohesion Social
    definicion: >
      Grado de identificación y sentido de pertenencia que la población
      declara respecto a la Región de Magallanes. Indicador de arraigo
      territorial y capital social comunitario.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% de personas que declara sentirse identificado con la región"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Sexo, grupo etario, tiempo de residencia"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      El aislamiento geográfico de Magallanes puede generar tanto un fuerte
      sentido de identidad local como percepción de desconexión con el resto
      del país.

  - id: 507
    nombre: "Percepción sobre descentralización"
    seccion: Cohesion Social
    definicion: >
      Evaluación ciudadana del proceso de descentralización del país y su
      impacto en la autonomía y desarrollo de la región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% de personas que evalúa positiva/negativamente la descentralización"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Sexo, grupo etario"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Tema particularmente sensible en regiones extremas como Magallanes, que
      históricamente han demandado mayor autonomía y recursos para su
      desarrollo.

  - id: 508
    nombre: "Percepción del aporte de instituciones y autoridades al desarrollo regional"
    seccion: Cohesion Social
    definicion: >
      Evaluación ciudadana sobre la contribución de distintas instituciones
      públicas y autoridades al desarrollo de la región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% que evalúa positivamente el aporte de cada institución al desarrollo"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Institución/autoridad evaluada, sexo"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Permite evaluar la legitimidad de la gestión pública a nivel regional.
      Complementa la confianza institucional con una dimensión evaluativa del
      desempeño.

  - id: 509
    nombre: "Percepción de responsabilidad de autoridades respecto al cuidado del medio ambiente"
    seccion: Cohesion Social
    definicion: >
      Evaluación ciudadana sobre el grado de responsabilidad que las
      autoridades regionales y nacionales asumen respecto a la protección del
      medio ambiente en la región.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% que evalúa positivamente la responsabilidad ambiental de las autoridades"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Nivel de autoridad evaluada, sexo"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      La Región de Magallanes alberga áreas naturales protegidas de
      importancia global (Torres del Paine, Cabo de Hornos), lo que hace
      especialmente relevante este indicador.

  - id: 510
    nombre: "Valoración de la ciencia y la tecnología"
    seccion: Cohesion Social
    definicion: >
      Percepción ciudadana sobre la importancia y el aporte de la ciencia y la
      tecnología al desarrollo de la región y al bienestar de la población.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de opinión."
    calculo: "% que valora positivamente el aporte de la ciencia y tecnología"
    fuente: "UER-UMAG — Encuesta Regional"
    fuente_id: uer_encuesta
    desagregaciones: "Sexo, grupo etario, nivel educacional"
    disponibilidad: "Según aplicación de encuesta"
    comentario: >
      Indicador relevante para la UMAG como principal institución de
      investigación de la región. Permite evaluar la vinculación entre la
      academia y la sociedad regional.

  - id: 511
    nombre: "Tasa de delitos de mayor connotación social"
    seccion: Cohesion Social
    definicion: >
      Número de delitos de mayor connotación social (DMCS) denunciados por
      cada 100.000 habitantes. Incluye robos con violencia, robos con fuerza,
      hurtos, lesiones, homicidios y violaciones.
    unidad: "Por 100.000 habitantes"
    tipo_dato: "Registro administrativo policial."
    calculo: "(Delitos DMCS denunciados / Población) x 100.000"
    fuente: "Subsecretaría de Prevención del Delito — Centro de Estudios y Análisis del Delito (CEAD)"
    fuente_id: cead
    desagregaciones: "Tipo de delito, comuna"
    disponibilidad: "Anual (trimestral con rezago)"
    comentario: >
      Mide delitos denunciados, no ocurridos (cifra negra). Magallanes
      presenta tasas de DMCS inferiores al promedio nacional. Los datos de
      prototipo corresponden a la tasa agregada de DMCS.

  - id: 512
    nombre: "Tasa de homicidios (por 100.000 habitantes)"
    seccion: Cohesion Social
    definicion: >
      Número de víctimas de homicidios consumados registradas durante un año
      por cada 100.000 habitantes. El indicador cuenta víctimas, no causas
      judiciales ni hechos policiales.
    unidad: "Víctimas de homicidios consumados por 100.000 habitantes"
    tipo_dato: "Registro administrativo consolidado (Informe Nacional de Víctimas de Homicidios Consumados)."
    calculo: "Se utilizan directamente las tasas regionales publicadas en el informe oficial para la Región de Magallanes y de la Antártica Chilena. No se calcularon tasas a partir del número de víctimas y la población, ni se realizaron estimaciones, interpolaciones o imputaciones.
"
    fuente: "Centro para la Prevención de Homicidios y Delitos Violentos, Subsecretaría de Prevención del Delito — Informe Nacional de Víctimas de Homicidios Consumados 2025"
    fuente_id: obs_homicidios
    desagregaciones: "Región (serie nacional comparable en la fuente)"
    disponibilidad: "Anual, 2018-2025"
    comentario: >
      Chile presenta tasas de homicidio bajas en contexto latinoamericano.
      Magallanes tiene tasas aun menores, aunque el bajo número de casos hace
      que pequeñas variaciones absolutas generen cambios porcentuales
      significativos. La matriz original de Datos Magallanes identificaba a
      MINSAL-DEIS como fuente; esta serie usa en cambio el Observatorio de
      Homicidios, que publica la cifra oficial consolidada y validada
      específicamente para víctimas de homicidios consumados. Las cifras
      pueden presentar revisiones entre publicaciones como resultado de
      actualizaciones de las investigaciones y del proceso de validación
      interinstitucional.

  - id: 513
    nombre: "Tasa de mortalidad por suicidios y lesiones autoinfligidas"
    seccion: Cohesion Social
    definicion: >
      Número de defunciones por suicidio y lesiones autoinfligidas
      intencionalmente ocurridas durante un año, expresado por cada 100.000
      habitantes. Corresponde a las causas clasificadas bajo los códigos
      X60-X84 de la Clasificación Internacional de Enfermedades, décima
      revisión (CIE-10).
    unidad: "Defunciones por 100.000 habitantes"
    tipo_dato: "Registro administrativo de estadísticas vitales (DEIS)."
    calculo: "Se utilizan directamente los valores publicados por el SIIT (Biblioteca del Congreso Nacional) para la Región de Magallanes y de la Antártica Chilena, cuya fuente institucional corresponde al DEIS. No se realizaron estimaciones, interpolaciones, imputaciones ni recálculos.
"
    fuente: "DEIS-MINSAL — Estadísticas Vitales, vía Sistema Integrado de Información Territorial (SIIT) de la Biblioteca del Congreso Nacional"
    fuente_id: ine_vitales
    desagregaciones: "Sin desagregacion en la serie regional publicada"
    disponibilidad: "Anual, 2000-2020"
    comentario: >
      Chile presenta tasas de suicidio superiores al promedio OCDE. Magallanes
      históricamente ha registrado tasas superiores al promedio nacional,
      posiblemente asociado a factores climáticos y de aislamiento geográfico.
      El portal SIIT publica un valor de 0,0 para Magallanes en 2010; ese
      valor se conserva tal como aparece en la fuente y no se trata como dato
      faltante, aunque se recomienda corroborarlo directamente con DEIS antes
      de realizar interpretaciones específicas sobre ese año.

  - id: 514
    nombre: "Tasa de participación en organizaciones sociales"
    seccion: Cohesion Social
    definicion: >
      Proporción de la población que participa activamente en al menos una
      organización social (junta de vecinos, club deportivo, organización
      comunitaria, voluntariado, etc.).
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato de encuesta de hogares."
    calculo: "(Personas que participan en organizaciones / Población 15+) x 100"
    fuente: "MIDESO — Encuesta CASEN; UER-UMAG — Encuesta Regional"
    fuente_id: casen
    desagregaciones: "Tipo de organización, sexo, grupo etario"
    disponibilidad: "Bienal (CASEN); según encuesta regional"
    comentario: >
      La participación en organizaciones sociales es un indicador de capital
      social comunitario. Chile presenta una tendencia declinante en
      participación en organizaciones tradicionales.

  - id: 515
    nombre: "Participación electoral"
    seccion: Cohesion Social
    definicion: >
      Proporción de personas inscritas en el padrón electoral que emitió voto
      (incluye votos válidos, en blanco y nulos) en una elección determinada.
    unidad: "Porcentaje (%)"
    tipo_dato: "Dato administrativo de resultados electorales oficiales."
    calculo: "(Votos emitidos / Padrón electoral) x 100"
    fuente: "SERVEL — Resultados electorales oficiales"
    fuente_id: servel
    desagregaciones: "Sexo, tipo de elección, comuna"
    disponibilidad: "Por elección (aproximadamente cada 2-4 años)"
    comentario: >
      Voto voluntario desde la reforma de 2012. Las series anteriores a esa
      fecha no son comparables directamente con los datos actuales. Indicador
      adicional no incluido en el listado original de 63 pero relevante para
      el análisis de cohesión social y presente en el dashboard.
