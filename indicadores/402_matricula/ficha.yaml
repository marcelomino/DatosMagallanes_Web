# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 402
nombre: "Tasa neta de matrícula por nivel educativo"
seccion: Bienestar

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Proporción de personas en edad oficial de cursar un nivel educativo que
  efectivamente se encuentran matriculadas en ese nivel.
unidad: "Porcentaje (%)"
tipo_dato: "Dato administrativo de registros de matrícula."
calculo: "(Matriculados en edad oficial / Total en edad oficial) x 100"
fuente: "MINEDUC — Sistema de Información General de Estudiantes (SIGE)"
fuente_id: mineduc_sige   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, dependencia administrativa, zona, nivel educativo"
disponibilidad: "Anual"
comentario: >
  Diferente a la tasa bruta de matrícula. Refleja el acceso oportuno al
  sistema educativo en la edad correspondiente al nivel. Se presenta para
  educación básica, media y superior.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
