# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 306
nombre: "Brecha salarial entre sexos"
seccion: Pobreza e Ingresos

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Diferencia porcentual entre el ingreso laboral promedio de hombres y
  mujeres, expresada como proporción del ingreso masculino. Indicador de
  inequidad de género en el mercado laboral.
unidad: "Porcentaje (%)"
tipo_dato: "Dato de encuesta de hogares."
calculo: "((Ingreso hombres - Ingreso mujeres) / Ingreso hombres) x 100"
fuente: "MIDESO — Encuesta CASEN; INE — ESI"
fuente_id: casen   # clave en indicadores/fuentes.yaml
desagregaciones: "Nivel educacional, sector económico"
disponibilidad: "Bienal (CASEN); anual (ESI)"
comentario: >
  Los datos de prototipo muestran ingresos promedio por sexo. La brecha
  salarial puede explicarse parcialmente por diferencias en horas
  trabajadas, sector y nivel educacional, pero persiste una brecha no
  explicada por estas variables.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
