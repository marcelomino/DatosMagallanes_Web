# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 101
nombre: "Población regional según sexo"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Número de hombres y de mujeres censados o estimados a nivel regional en un
  año dado, desde el censo de 1907. Refleja el tamaño y la composición por sexo
  de la población residente habitual en la Región de Magallanes y de la
  Antártica Chilena.
unidad: "Número de personas"
tipo_dato: "Censos de Población y estimaciones intercensales."
calculo: "Conteo directo de población por sexo en operaciones censales; estimaciones intercensales basadas en componentes demográficos"
fuente: "INE — Censos de Población y Vivienda; Estimaciones y proyecciones de población"
fuente_id: censo   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo"
disponibilidad: "Censos de Población (1907–2024)"
comentario: >
  Incluye crecimiento vegetativo (nacimientos menos defunciones) y saldo
  migratorio (inmigración menos emigración). Los valores intercensales son
  estimaciones sujetas a revisión posterior. La serie larga permite observar
  la transición demográfica regional y el paso de una población muy
  masculinizada a una composición cercana al equilibrio.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "MOCKUP 17-10-2026: hombres y mujeres ficticios sobre el total de prototipo"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
  - "MOCKUP: las columnas hombres y mujeres son ficticias (reparto inventado del total). Reemplazar por los censos INE antes de publicar"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-10-17
    nota: "Renombrada de 101_poblacion_total a 101_poblacion_regional_segun_sexo. Se agregan columnas hombres y mujeres con datos mockup"
