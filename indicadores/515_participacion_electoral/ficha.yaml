# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 515
nombre: "Participación electoral"
seccion: Cohesion Social

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Proporción de personas inscritas en el padrón electoral que emitió voto
  (incluye votos válidos, en blanco y nulos) en una elección determinada.
unidad: "Porcentaje (%)"
tipo_dato: "Dato administrativo de resultados electorales oficiales."
calculo: "(Votos emitidos / Padrón electoral) x 100"
fuente: "SERVEL — Resultados electorales oficiales"
fuente_id: servel   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, tipo de elección, comuna"
disponibilidad: "Por elección (aproximadamente cada 2-4 años)"
comentario: >
  Voto voluntario desde la reforma de 2012. Las series anteriores a esa
  fecha no son comparables directamente con los datos actuales. Indicador
  adicional no incluido en el listado original de 63 pero relevante para el
  análisis de cohesión social y presente en el dashboard.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
