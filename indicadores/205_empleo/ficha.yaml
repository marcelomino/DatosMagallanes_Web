# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 205
nombre: "Tasa de desempleo"
seccion: Economia

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Proporción de personas en la fuerza de trabajo que no tienen empleo y
  buscan activamente uno durante el período de referencia.
unidad: "Porcentaje (%)"
tipo_dato: "Dato de encuesta de hogares."
calculo: "(Desocupados / Fuerza de trabajo) x 100"
fuente: "INE — Encuesta Nacional de Empleo (ENE)"
fuente_id: ine_ene   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, edad, zona"
disponibilidad: "Trimestral (trimestres móviles)"
comentario: >
  Presenta estacionalidad marcada por actividades de turismo y pesca. Se
  reporta el promedio anual para reducir la variabilidad estacional. Los
  datos incluyen también la tasa de ocupación como complemento.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-09-16
    nota: "La columna `ocupacion` se separo a la pieza 216, que no tenia ficha propia. Esta carpeta queda solo con la tasa de desempleo (ficha 205)."
