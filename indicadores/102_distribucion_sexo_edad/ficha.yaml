# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 102
nombre: "Distribución de la población por sexo y edad"
seccion: Poblacion

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Composición porcentual de la población regional según grupos quinquenales
  o decenales de edad y sexo. Permite construir la pirámide poblacional y
  caracterizar la estructura demográfica.
unidad: "Porcentaje (%)"
tipo_dato: "Censo de Población y estimaciones intercensales."
calculo: "(Población del grupo de edad y sexo / Población total) x 100"
fuente: "INE — Censo de Población y Vivienda 2017; Estimaciones y proyecciones"
fuente_id: censo   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, grupo etario"
disponibilidad: "Censal (2017); estimaciones anuales"
comentario: >
  La pirámide poblacional de Magallanes muestra un perfil de envejecimiento
  avanzado, con base angosta y ensanchamiento en edades medias y superiores.
  Los datos de prototipo corresponden a la estimación 2023.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
