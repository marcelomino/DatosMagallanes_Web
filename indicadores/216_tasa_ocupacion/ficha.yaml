# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 216
nombre: "Tasa de ocupación"
seccion: Economia

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Proporción de personas ocupadas respecto de la población en edad de
  trabajar durante el período de referencia.
unidad: "Porcentaje (%)"
tipo_dato: "Dato de encuesta de hogares."
calculo: "(Ocupados / Población en edad de trabajar) x 100"
fuente: "INE — Encuesta Nacional de Empleo (ENE)"
fuente_id: ine_ene   # clave en indicadores/fuentes.yaml
desagregaciones: "Sexo, edad, zona"
disponibilidad: "Trimestral (trimestres móviles)"
comentario: >
  Hasta septiembre de 2026 esta serie se publicaba en el cuadro II.2 sin
  ficha propia, junto a la tasa de desempleo (205). Son medidas
  complementarias pero distintas: la ocupación se calcula sobre la población
  en edad de trabajar y el desempleo sobre la fuerza de trabajo, de modo que
  no suman cien. Ficha redactada a partir de la 205; los campos cálculo,
  disponibilidad y desagregaciones deben confirmarse contra la fuente
  primaria.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
  - "PENDIENTE DE VALIDACION: la ficha 216 se redacto al separar esta serie, a partir de la ficha 205. Los campos `calculo`, `disponibilidad` y `desagregaciones` deben confirmarse contra la fuente primaria."
  - "Ocupacion y desempleo no suman cien: la primera se calcula sobre la poblacion en edad de trabajar y la segunda sobre la fuerza de trabajo."
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/ (como parte de 205_empleo)"
  - fecha: 2026-09-16
    nota: "Separada de 205_empleo. Se publicaba en el cuadro II.2 junto a la tasa de desempleo, sin ficha propia."
