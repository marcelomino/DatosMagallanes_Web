# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 201
nombre: "Tasa de variación anual del PIB regional"
seccion: Economia

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Cambio porcentual del Producto Interno Bruto regional respecto al año
  anterior. Mide la velocidad de crecimiento o contracción de la actividad
  económica de la región.
unidad: "Porcentaje (%)"
tipo_dato: "Estimación de cuentas nacionales regionales."
calculo: "((PIB año t - PIB año t-1) / PIB año t-1) x 100"
fuente: "Banco Central de Chile — Cuentas Nacionales Regionales"
fuente_id: banco_central   # clave en indicadores/fuentes.yaml
desagregaciones: "No aplica"
disponibilidad: "Anual (rezago de 18-24 meses)"
comentario: >
  Derivada de la serie de PIB regional. En el dashboard se presentan tanto
  el PIB en nivel como su variación anual. La pandemia de 2020 produjo una
  caída significativa seguida de una recuperación parcial.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitacora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "datos de prototipo, migracion inicial"
notas_calidad:
  - "Datos de prototipo, pendientes de validacion con fuente primaria"
historial:
  - fecha: 2026-08-04
    nota: "Creacion de carpeta en reestructuracion indicadores/"
  - fecha: 2026-09-16
    nota: "Renombrada a 201_variacion_pib. El CSV contenia el nivel del PIB y su variacion anual; el nivel paso a la pieza 215, que es la que describe."
