# ── Identidad ────────────────────────────────────────────────────────────
# El id manda: debe coincidir con el prefijo de la carpeta que contiene
# este archivo. R/00_data.R lo verifica al arrancar y aborta si no calza.
id: 405
nombre: "Matrícula total en educación superior"
seccion: Bienestar

# ── Ficha publicada ──────────────────────────────────────────────────────
# Lo que se publica en el capitulo VI, mas el titulo y el pie de los cuadros
# que cuelgan de esta ficha.
definicion: >
  Número de registros de matrícula informados por las instituciones de
  educación superior de la región para programas de pregrado, posgrado y
  postítulo. Es un conteo de matrículas, no de personas: una misma persona
  puede registrar más de una matrícula, de modo que el indicador no
  representa estudiantes únicos.
unidad: "Registros de matrícula"
tipo_dato: "Registro administrativo (SIES)."
calculo: "Conteo de registros de matrícula en programas de pregrado, posgrado y postítulo, fila 'XII Región'"
fuente: "Ministerio de Educación, Subsecretaría de Educación Superior — SIES, Compendio Histórico de Educación Superior"
fuente_id: mineduc_sies   # clave en indicadores/fuentes.yaml
desagregaciones: "Sin desagregación en esta serie regional; el compendio SIES permite desagregar por institución, área del conocimiento y sexo"
disponibilidad: "Anual, 1984-2026"
comentario: >
  La región se asocia al programa o sede que informa la institución: en
  modalidad a distancia esa imputación administrativa puede no coincidir
  con la ubicación de la persona estudiante. La serie tiene dos tramos de
  origen distinto: 1984-2006 proviene de bases agregadas de la antigua
  División de Educación Superior (DIVESUP), previa a la creación de SIES;
  desde 2007 la información es recopilada directamente por SIES desde las
  instituciones. Conviene distinguir ambos tramos en análisis de largo
  plazo. La Universidad de Magallanes es la principal institución de
  educación superior de la región.

# ── Aparato interno ──────────────────────────────────────────────────────
# No se publica: es la bitácora de quien mantiene el indicador.
procesamiento:
  script: "pendiente (proyecto hermano DATOS_MAG_MMO)"
  ultimo: "Transcripción directa de Compendio_Histórico_Matrícula_2026_SIES_31072026.xlsx, hoja 'Matrícula Total', fila 'XII Región'. Sin cálculos, interpolaciones, imputaciones ni redondeos adicionales."
historial:
